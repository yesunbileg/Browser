<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIWise</title>
  <style>
    :root {
      color-scheme: dark;
      font: 13px/1.45 Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111214;
      color: #f3f4f4;
    }
    * { box-sizing: border-box; }
    body { margin: 0; width: 360px; max-height: 560px; overflow-y: auto; padding: 18px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 19px; }
    .brand { display: flex; align-items: center; gap: 9px; color: #70d6a2; font-size: 17px; font-weight: 750; letter-spacing: -.035em; }
    .brand-mark { display: grid; width: 27px; height: 27px; place-items: center; border: 1.5px solid #70d6a2; border-radius: 9px; font-size: 14px; font-weight: 800; line-height: 1; }
    .actions { display: flex; align-items: center; gap: 14px; }
    .action { border: 0; padding: 3px 0; background: transparent; color: #73dba5; font: inherit; font-size: 12px; font-weight: 600; }
    .action:disabled { cursor: default; opacity: .7; }
    .settings { display: grid; width: 24px; height: 24px; place-items: center; color: #797c80; font-size: 17px; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin-bottom: 17px; padding: 4px; border: 1px solid #2a2c2f; border-radius: 12px; background: #191a1d; }
    .tab { min-height: 34px; border: 0; border-radius: 8px; background: transparent; color: #a4a7aa; font: inherit; font-size: 12px; font-weight: 650; cursor: pointer; }
    .tab[aria-selected="true"] { background: #2a2c2e; color: #f5f6f5; box-shadow: 0 1px 3px #0008; }
    .section-label { margin: 0 0 9px; color: #83878a; font-size: 10px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
    #accounts { display: grid; gap: 8px; }
    .account { padding: 12px 13px; border: 1px solid #2b2d2f; border-radius: 11px; background: #191a1c; }
    .name { margin: 0 0 4px; color: #f2f3f1; font-size: 13px; font-weight: 650; overflow-wrap: anywhere; }
    .status { margin: 0; color: #c4c7c6; font-size: 12px; }
    .reset { margin: 5px 0 0; color: #eac77d; font-size: 11px; font-weight: 600; }
    .meta { margin: 6px 0 0; color: #777b7d; font-size: 10px; }
    .empty, .unavailable { margin: 0; padding: 14px; border: 1px solid #2a2c2e; border-radius: 10px; background: #191a1c; color: #b4b7b6; font-size: 12px; }
    .unavailable strong { display: block; margin-bottom: 4px; color: #ebedeb; font-size: 12px; }
    footer { margin-top: 14px; color: #696d6f; font-size: 10px; line-height: 1.5; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="AIWise"><span class="brand-mark" aria-hidden="true">A</span><span>AIWise</span></div>
    <nav class="actions" aria-label="Menu actions">
      <button class="action" type="button" disabled title="Bookmarks are unavailable">Bookmarks</button>
      <button class="action settings" type="button" disabled aria-label="Settings unavailable" title="Settings are unavailable">⚙</button>
    </nav>
  </header>
  <div class="tabs" role="tablist" aria-label="AI service">
    <button class="tab" type="button" role="tab" id="claude-tab" aria-selected="true" aria-controls="claude-panel">Claude</button>
    <button class="tab" type="button" role="tab" id="gemini-tab" aria-selected="false" aria-controls="gemini-panel">Gemini</button>
  </div>
  <main>
    <section id="claude-panel" role="tabpanel" aria-labelledby="claude-tab">
      <h1 class="section-label">Claude accounts</h1>
      <div id="accounts" aria-live="polite"></div>
    </section>
    <section id="gemini-panel" role="tabpanel" aria-labelledby="gemini-tab" hidden>
      <div class="unavailable"><strong>Gemini account tracking</strong>Gemini tracking is not configured.</div>
    </section>
  </main>
  <footer>Only Claude’s confirmed limit message counts as exhausted. A passed reset time does not confirm access.</footer>
  <script src="popup.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIWise</title>
  <style>
    :root {
      --background: #0f172a;
      --foreground: #f8fafc;
      --accent: #4ade80;
      --border: #334155;
      --muted: #cbd5e1;
      --surface: #1b2639;
      --surface-soft: #172338;

      color-scheme: dark;
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--background);
      color: var(--foreground);
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; width: 390px; max-width: 100vw; max-height: 600px; overflow-y: auto; padding: 20px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 19px; }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--foreground); font-size: 19px; font-weight: 760; letter-spacing: -.04em; }
    .brand-mark { display: grid; width: 32px; height: 32px; place-items: center; border: 1px solid var(--accent); border-radius: 11px; color: var(--accent); background: #142b2a; }
    .brand-mark svg { width: 18px; height: 18px; }
    .account-total { padding: 5px 9px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); background: var(--surface-soft); font-size: 12px; font-weight: 600; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 18px; padding: 4px; border: 1px solid #29364b; border-radius: 13px; background: #111d31; }
    .tab { min-height: 44px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: inherit; font-size: 14px; font-weight: 650; cursor: pointer; transition: background-color .15s ease, color .15s ease; }
    .tab[aria-selected="true"] { background: #26344b; color: #fff; box-shadow: 0 1px 3px #02061780; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; margin: 0 1px 10px; }
    .section-label { margin: 0; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
    .accounts { display: grid; gap: 10px; }
    .account { padding: 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); box-shadow: 0 5px 16px #02061721; }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .name { min-width: 0; margin: 1px 0 0; color: var(--foreground); font-size: 14px; font-weight: 650; overflow-wrap: anywhere; }
    .badge { flex: 0 0 auto; padding: 4px 8px; border-radius: 999px; color: #fed7aa; background: #3a2b21; font-size: 12px; font-weight: 650; }
    .badge.unknown { color: var(--muted); background: #29364b; }
    .status { margin: 10px 0 0; color: #e2e8f0; font-size: 13px; }
    .countdown { display: block; margin-top: 4px; color: var(--foreground); font-size: 25px; font-variant-numeric: tabular-nums; font-weight: 720; letter-spacing: -.035em; line-height: 1.2; }
    .reset-label { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .progress-wrap { margin-top: 14px; }
    .progress-caption { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; color: var(--muted); font-size: 12px; }
    .progress-track { height: 7px; overflow: hidden; border-radius: 999px; background: var(--border); }
    .progress-fill { height: 100%; border-radius: inherit; background: var(--accent); }
    .progress-track.unmeasured { background: repeating-linear-gradient(135deg, var(--border) 0 5px, #25334a 5px 10px); }
    .meta { margin: 12px 0 0; color: var(--muted); font-size: 12px; }
    .empty, .unavailable { margin: 0; padding: 15px; border: 1px solid var(--border); border-radius: 13px; background: var(--surface); color: #e2e8f0; font-size: 13px; }
    .unavailable strong { display: block; margin-bottom: 4px; color: var(--foreground); font-size: 14px; }
    footer { margin-top: 14px; padding: 11px 12px; border-radius: 11px; color: var(--muted); background: var(--surface-soft); font-size: 12px; line-height: 1.5; }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="AIWise"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18 10.5 5 16 18M7.1 13h6.8"/><path d="m17.5 9 3.5 9"/><path d="m19 5 3 3"/></svg></span><span>AIWise</span></div>
    <span id="account-total" class="account-total">0 accounts</span>
  </header>
  <div class="tabs" role="tablist" aria-label="AI service">
    <button class="tab" type="button" role="tab" id="claude-tab" aria-selected="true" aria-controls="claude-panel">Claude</button>
    <button class="tab" type="button" role="tab" id="gemini-tab" aria-selected="false" aria-controls="gemini-panel">Gemini</button>
  </div>
  <main>
    <section id="claude-panel" role="tabpanel" aria-labelledby="claude-tab">
      <div class="section-head"><h1 class="section-label">Claude accounts</h1></div>
      <div id="accounts" class="accounts" aria-live="polite"></div>
    </section>
    <section id="gemini-panel" role="tabpanel" aria-labelledby="gemini-tab" hidden>
      <div class="unavailable"><strong>Gemini account tracking</strong>Gemini tracking is not configured.</div>
    </section>
  </main>
  <footer>Progress starts when a limit is detected. Check Claude again after the reset time.</footer>
  <script src="content-scripts/usage-state.js"></script>
  <script src="popup.js"></script>
</body>
</html>
